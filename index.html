<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 평창효석문화축제 영상 캠페인 성과 대시보드</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f3f5fa;font-family:-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
@media(prefers-color-scheme:dark){ body{background:#11131c} }
.box{background:#fff;border:1px solid #e2e6f0;border-radius:16px;padding:44px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;min-width:300px;max-width:420px;box-shadow:0 6px 24px rgba(20,24,40,.12)}
@media(prefers-color-scheme:dark){ .box{background:#191c28;border-color:#2b2f42;box-shadow:0 6px 24px rgba(0,0,0,.4)} }
.logo{font-size:16px;font-weight:800;color:#1b2033;text-align:center;line-height:1.4}
@media(prefers-color-scheme:dark){ .logo{color:#e7e9f4} }
.sub{font-size:12.5px;color:#8992ab;margin-top:-8px;text-align:center;line-height:1.6}
input{width:100%;padding:11px 14px;border-radius:8px;border:1.5px solid #e2e6f0;background:#f3f5fa;color:#1b2033;font-size:15px;outline:none;text-align:center;letter-spacing:3px;font-family:inherit}
@media(prefers-color-scheme:dark){ input{background:#11131c;color:#e7e9f4;border-color:#2b2f42} }
input:focus{border-color:#3d5fd9}
button{width:100%;padding:11px;border-radius:8px;background:#3d5fd9;color:#fff;font-size:13.5px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
.err{font-size:11.5px;color:#e0555f;height:14px}
#done{display:none;font-size:13px;color:#4d5670;text-align:center;line-height:1.7}
@media(prefers-color-scheme:dark){ #done{color:#a3aac4} }
</style>
</head>
<body>
<div class="box">
  <div class="logo">2026 평창효석문화축제 영상 캠페인 성과 대시보드</div>
  <div class="sub">2026.08.13 ~ 09.11 · 유튜브(Google VVC)</div>
  <div id="gate" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">
    <input id="pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkPw()">
    <div class="err" id="err"></div>
    <button onclick="checkPw()">확인</button>
  </div>
  <div id="done">캠페인 시작 전입니다.<br>8월 13일 집행 시작 후 성과 데이터가 표시됩니다.</div>
</div>
<script>
const PW = "54321";
function reveal(){ document.getElementById('gate').style.display='none'; document.getElementById('done').style.display='block'; }
if (sessionStorage.getItem('hyoseok_dashboard_auth')==='1') reveal();
function checkPw(){
  if (document.getElementById('pw').value === PW) { sessionStorage.setItem('hyoseok_dashboard_auth','1'); reveal(); }
  else { const e=document.getElementById('err'); e.textContent='비밀번호가 틀렸습니다'; setTimeout(()=>e.textContent='',2000); }
}
document.getElementById('pw').focus();
</script>
</body>
</html>
